<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Gestão de Imóveis no KLSystem. Cadastre, edite e visualize todos os seus imóveis.">
    <title>Imóveis - KLSystem</title>
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/sidebar.css">
    <link rel="stylesheet" href="../../css/buttons.css">
    <link rel="stylesheet" href="../../css/cards.css">
    <link rel="stylesheet" href="../../css/tables.css">
    <link rel="stylesheet" href="../../css/badge.css">
    <link rel="stylesheet" href="../../css/forms.css">
    <link rel="stylesheet" href="../../css/pagination.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <input type="checkbox" class="sidebar-checkbox" id="sidebar-toggle">
    <label for="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
    </label>
    <div class="sidebar-overlay"></div>

    <aside class="sidebar">
        <div class="logo">
            <h1>KL<span>System</span></h1>
        </div>
        <nav>
            <ul>
                <li><a href="../dashboard/index.html">Dashboard</a></li>
                <li class="active"><a href="../imoveis/index.html">Imóveis</a></li>
                <li><a href="../inquilinos/index.html">Inquilinos</a></li>
                <li><a href="../contratos/index.html">Contratos</a></li>
                <li><a href="../pagamentos/index.html">Pagamentos</a></li>
                <li class="profile"><a href="../perfil/index.html">Meu Perfil</a></li>
                <li class="logout"><a href="../../index.html">Sair</a></li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <h2>Gestão de Imóveis</h2>
            <div class="user-info">
                <span>Olá, Administrador</span>
            </div>
        </header>

        <div class="dashboard-scroll">
            <section class="form-section">
                <h4 id="form-title">Cadastrar Imóvel</h4>
                <div id="feedback" class="feedback" aria-live="polite"></div>
                <form id="imovel-form" action="#">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="apelido-imovel">Título/Identificação</label>
                            <input type="text" id="apelido-imovel" placeholder="Ex: Apto 402 - Centro" minlength="3" required>
                        </div>
                        <div class="form-group">
                            <label for="tipo-imovel">Tipo</label>
                            <select id="tipo-imovel" required>
                                <option value="Apartamento">Apartamento</option>
                                <option value="Casa">Casa</option>
                                <option value="Sala Comercial">Sala Comercial</option>
                                <option value="Kitnet">Kitnet</option>
                                <option value="Galpão">Galpão</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="valor-aluguel">Valor do Aluguel</label>
                            <input type="number" id="valor-aluguel" min="0.01" step="0.01" placeholder="R$ 0,00" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group" style="flex: 2;">
                            <label for="endereco">Endereço completo</label>
                            <input type="text" id="endereco" placeholder="Rua, número, bairro, cidade - UF" required>
                        </div>
                        <div class="form-group">
                            <label for="status">Status</label>
                            <select id="status" required>
                                <option value="Disponivel">Disponível</option>
                                <option value="Alugado">Alugado</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group" style="flex: 1;">
                            <label for="descricao">Descrição</label>
                            <input type="text" id="descricao" placeholder="Informações adicionais (opcional)">
                        </div>
                    </div>
                    <div class="form-actions" style="margin-top: 1.5rem; display: flex; gap: 1rem;">
                        <button type="submit" class="btn btn-primary" id="btn-salvar">Salvar</button>
                        <button type="button" class="btn btn-danger" id="btn-cancelar-edicao">Cancelar</button>
                    </div>
                </form>
            </section>

            <section class="dashboard-details">
                <div class="table-container">
                    <div class="table-header">
                        <h3>Lista de Imóveis</h3>
                    </div>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Identificação</th>
                                    <th>Tipo</th>
                                    <th>Valor Base</th>
                                    <th>Status</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="imoveis-tbody">
                            </tbody>
                        </table>
                    </div>
                    <div class="pagination-container"></div>
                </div>
            </section>
        </div>
    </main>
    <script src="../../js/http.js"></script>
    <script src="../../js/session.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/page.js"></script>
    <script src="imoveis.js"></script>
</body>

</html>
